# render.yaml — Render Infrastructure Blueprint
# Commit this file to the root of your repo.
# Render will auto-detect it and wire up both services.
#
# Deploy steps after pushing this file:
#   1. Go to https://dashboard.render.com → New → Blueprint
#   2. Connect your GitHub repo
#   3. Render reads this file and creates both resources automatically

databases:
  - name: amazon-agent-db
    databaseName: amazon_agent
    plan: free                     # upgrade to starter ($7/mo) for production

services:
  - type: web
    name: amazon-cs-agent
    runtime: python
    plan: free                     # upgrade to starter for always-on
    buildCommand: bash build.sh
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    # ── Environment variables ─────────────────────────────────
    envVars:
      # Injected automatically from the database above
      - key: DATABASE_URL
        fromDatabase:
          name: amazon-agent-db
          property: connectionString

      # Add your Groq API key in the Render dashboard:
      #   Service → Environment → Add Environment Variable
      - key: GROQ_API_KEY
        sync: false                # marks it as a secret to set manually

      # HuggingFace model cache — keeps the model inside the build dir
      - key: HF_HOME
        value: /opt/render/project/src/.cache/huggingface

      # Prevents tokenizer warnings in logs
      - key: TOKENIZERS_PARALLELISM
        value: "false"

      # Python output unbuffered (better logs on Render)
      - key: PYTHONUNBUFFERED
        value: "1"